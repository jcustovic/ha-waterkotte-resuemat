title: Waterkotte Wärmepumpe
views:
- title: Übersicht
  path: overview
  type: sections
  sections:
  - type: grid
    title: Status & Steuerung
    cards:
    - type: entities
      title: Steuerung
      entities:
      - entity: input_boolean.heizungonoff
        name: Heizung Ein/Aus
      - entity: input_boolean.warmwasseronoff
        name: Warmwasser Ein/Aus
      - entity: input_boolean.kuehlung_on_off
        name: Kühlung Ein/Aus
      - entity: input_number.kuehlung_temp
        name: Kühlung Solltemperatur
      - entity: input_number.heizung_temp
        name: Heizung Solltemperatur
      - entity: sensor.nodered_6b6b5ec45d6fcaab
        name: Heizung Einsatztemp
      - entity: sensor.nodered_79db91880beffbbe
        name: Kühlung Einsatztemp
      - entity: sensor.datumuhrzeit
        name: Uhrzeit Wärmepumpe
        icon: mdi:clock-outline
  - type: grid
    title: Betriebsstatus
    cards:
    - type: entities
      title: Betriebsstatus
      entities:
      - entity: binary_sensor.heizung_lauft_2
